# Configuração do Cloudflare Workers (deploy estático do site via Workers Builds).
# O Netlify continua sendo o alvo principal/funcional (com as rotas /api/*).
# Aqui o Worker serve apenas os assets estáticos gerados em ./dist.
name = "realcredmais"
compatibility_date = "2026-06-09"

# Builda o site antes do deploy (gera ./dist com o Vite + scripts de pós-build).
[build]
command = "npm run build"

# Worker apenas de assets (sem script): publica o conteúdo estático de ./dist.
# not_found_handling = single-page-application espelha o redirect do Netlify
# (/* -> /index.html), servindo o index para rotas não encontradas.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
